<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Ku Garang Asem Podo Roso</title>
<script>try{var t=localStorage.getItem("kasir-tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f2f6f3;--sf:#fff;--tx:#14231b;--mu:#5b6b62;--ac:#1f6f4a;--act:#fff;--bd:#d5e0d9;--bad:#c0332b;--ok:#1f6f4a;--soft:#e4efe8;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--sf:#18231d;--tx:#e8f1ec;--mu:#9bb0a4;--ac:#4fc08a;--act:#07140d;--bd:#2a3a31;--bad:#ff7a70;--ok:#4fc08a;--soft:#1f3328;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--sf:#18231d;--tx:#e8f1ec;--mu:#9bb0a4;--ac:#4fc08a;--act:#07140d;--bd:#2a3a31;--bad:#ff7a70;--ok:#4fc08a;--soft:#1f3328;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
.wrap{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;font-weight:800;margin:0}
h2{font-size:16px;font-weight:800;margin:0 0 10px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--act)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.btn{border:1px solid var(--bd);background:var(--sf);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.bad.arm{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px}
.grid2{display:grid;gap:14px}
@media(min-width:800px){.grid2{grid-template-columns:1.4fr 1fr;align-items:start}#cartbox{position:sticky;top:12px}}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.item{text-align:left;border:1px solid var(--bd);background:var(--sf);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;min-height:74px}
.item:active{transform:scale(.97)}
.item b{font-weight:600}
.item span{color:var(--mu);font-size:13px}
.item i{position:absolute;top:8px;right:8px;background:var(--ac);color:var(--act);font-style:normal;font-weight:800;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px}
.item.in{border-color:var(--ac);background:var(--soft)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:var(--mu)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--sf);cursor:pointer;font-weight:800}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:22px;margin:12px 0}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.quick .btn{padding:6px 10px;font-size:13px}
.kem{margin:12px 0;padding:12px;border-radius:12px;background:var(--soft);display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.kem.kurang{color:var(--bad)}
.kem .v{font-size:22px}
.empty{color:var(--mu);padding:14px 0;text-align:center}
.f{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:560px){.f{grid-template-columns:2fr 1fr 1.2fr auto}}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sf);border-top:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;z-index:5}
@media(min-width:800px){.bar{display:none}body{padding-bottom:20px}}
.hide{display:none!important}
header{flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand img{border-radius:10px;background:#fff}
.brand small{color:var(--mu);display:block;line-height:1.2}
.tabs{overflow-x:auto;max-width:100%;order:3;width:100%}
#tema{margin-left:auto}
.sw{position:relative;flex:none;width:78px;height:40px;padding:0;border:0;border-radius:999px;overflow:hidden;cursor:pointer;background:#64b5f6;box-shadow:inset 0 3px 7px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.55)}
.sky{position:absolute;inset:0;transition:opacity .35s}
.sky.day{background:radial-gradient(circle 15px at 72% 92%,#e6f3fe 96%,transparent 100%),radial-gradient(circle 12px at 92% 70%,#d3e9fc 96%,transparent 100%),radial-gradient(circle 13px at 50% 108%,#d9ecfd 96%,transparent 100%),radial-gradient(circle 10px at 98% 100%,#f1f8ff 96%,transparent 100%),linear-gradient(100deg,#1e88e5,#64b5f6 55%,#a8d4fa)}
.sky.night{opacity:0;background:radial-gradient(circle 1.4px at 16% 28%,#fff 90%,transparent),radial-gradient(circle 1px at 36% 70%,#fff 90%,transparent),radial-gradient(circle 1.6px at 50% 24%,#fff 90%,transparent),radial-gradient(circle 1px at 26% 82%,#fff 90%,transparent),radial-gradient(circle 1px at 60% 64%,#fff 90%,transparent),radial-gradient(circle 1.2px at 44% 48%,#cfd6e6 90%,transparent),linear-gradient(100deg,#131828,#222a3e 55%,#4b5266)}
.sw[data-m=night] .sky.night{opacity:1}
.sw[data-m=night] .sky.day{opacity:0}
.knob{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#ffd23a;box-shadow:inset 0 -3px 0 #f2a20a,0 3px 6px rgba(0,0,0,.4);transition:transform .35s cubic-bezier(.5,0,.2,1)}
.knob::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .35s;background:radial-gradient(circle 4px at 64% 27%,#a7b0c4 95%,transparent),radial-gradient(circle 6px at 35% 56%,#a7b0c4 95%,transparent),radial-gradient(circle 4px at 68% 74%,#a7b0c4 95%,transparent),#d5dae4;box-shadow:inset 0 -3px 0 #aab2c3}
.sw[data-m=night] .knob{transform:translateX(38px)}
.sw[data-m=night] .knob::after{opacity:1}
@media(prefers-reduced-motion:reduce){.sky,.knob,.knob::after{transition:none}}
.cal{margin:12px 0 4px;padding:14px 12px 12px;border-radius:26px;border:1px solid var(--bd);background:var(--sf);background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 72%),var(--sf);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.cal::before{content:"";display:block;width:34%;height:3px;margin:-15px auto 12px;border-radius:0 0 4px 4px;background:var(--ac)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch b{font-size:17px;font-weight:800}
.cn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;display:grid;place-items:center;padding:0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center}
.cw{font-size:12px;font-weight:700;color:var(--mu);padding:4px 0 8px}
.cd{height:40px;border:0;background:none;color:var(--tx);font:inherit;font-size:16px;cursor:pointer;border-radius:0;padding:0}
.cd.o{color:var(--mu);opacity:.4;cursor:default}
.cd.t{font-weight:800;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ac)}
.cd.r{background:var(--soft)}
.cd.s,.cd.e{background:var(--ac);color:var(--act);font-weight:800;border-radius:50%;box-shadow:0 6px 14px rgba(0,0,0,.28)}
.cs{margin-top:10px;text-align:center;color:var(--mu);font-size:13px}
.fld{display:grid;gap:4px;margin-bottom:10px}
.kertas{margin:0 auto;background:#fff;color:#111;border:1px solid #d8d8d8;border-radius:6px;padding:14px;font-size:13px;line-height:1.4}
.kertas .row{border-bottom:1px dashed #bbb;padding:5px 0}
.kertas small{color:#555}
.done .box{max-height:92vh;overflow:auto}
.tabs button{white-space:nowrap;flex:1}
.qr{display:block;max-width:100%;width:260px;margin:8px auto;border-radius:10px;background:#fff}
.note{background:var(--soft);border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
.rk{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.done{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:10}
.done .box{max-width:340px;width:100%}
.lbl{font-size:13px;color:var(--mu);margin-bottom:4px;display:block}
@media print{html:root:root:root{--tx:#000;--sf:#fff;--bd:#999;--mu:#444;--ok:#000;color-scheme:light}body{background:#fff}body *{visibility:hidden}#done,#done *{visibility:visible}#done{position:absolute;inset:0;background:none;display:block;padding:0}#cetak,#tutup,#done h2{display:none}.kertas{max-width:none!important;border:0!important;padding:0!important;color:#000!important}.done .box{border:0}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><img src="icons/icon-192.png" alt="" width="42" height="42"><div><h1>Kasir Ku</h1><small>Garang Asem Podo Roso</small></div></div>
  <button id="tema" class="sw" role="switch" aria-checked="false" aria-label="Mode malam" data-m="day"><span class="sky day"></span><span class="sky night"></span><span class="knob"></span></button>
    <div class="tabs" role="tablist">
    <button id="t1" class="on" role="tab">Kasir</button>
    <button id="t2" role="tab">Menu</button>
    <button id="t3" role="tab">Riwayat</button>
    <button id="t4" role="tab">Pengaturan</button>
  </div>
</header>

<section id="p1">
  <div class="grid2">
    <div class="box">
      <h2>Pilih menu</h2>
      <input id="cari" type="search" placeholder="Cari menu..." aria-label="Cari menu">
      <div class="quick" id="kat"></div>
      <div class="menu" id="menu"></div>
    </div>
    <div class="box" id="cartbox">
      <h2>Pesanan</h2>
      <div id="cart"></div>
      <div class="tot"><span>Total</span><span id="total">Rp0</span></div>
      <span class="lbl">Metode pembayaran</span><div class="quick" id="met"></div><div id="pinfo" class="hide"></div>
      <div id="cashbox"><label class="lbl" for="bayar">Uang dari pembeli</label>
      <input id="bayar" inputmode="numeric" placeholder="Rp0" autocomplete="off">
      <div class="quick" id="quick"></div>
      <div class="kem" id="kem"><span id="kl">Kembalian</span><span class="v" id="kv">Rp0</span></div></div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="kosong">Kosongkan</button>
        <button class="btn pri" id="selesai" style="flex:1">Selesaikan pesanan</button>
      </div>
    </div>
  </div>
</section>

<section id="p4" class="hide">
  <div class="tabs" id="sn" role="tablist" style="margin-bottom:14px">
    <button class="on" data-sub="tampilan">Tampilan</button>
    <button data-sub="bayar">Pembayaran</button>
    <button data-sub="struk">Struk</button>
  </div>

  <div id="sub-tampilan">
    <div class="box">
      <h2>Tampilan</h2>
      <div class="quick">
        <button class="btn" data-tema="auto">Otomatis</button>
        <button class="btn" data-tema="light">☀️ Siang</button>
        <button class="btn" data-tema="dark">🌙 Malam</button>
      </div>
    </div>
  </div>

  <div id="sub-bayar" class="hide">
    <div class="box" style="margin-bottom:14px">
      <h2>QRIS</h2>
      <input type="file" id="s_qris" accept="image/*" aria-label="Unggah gambar QRIS">
      <div id="qprev"></div>
      <button class="btn bad hide" id="qdel">Hapus gambar QRIS</button>
    </div>
    <div class="box">
      <h2>Rekening transfer</h2>
      <div id="rekf"></div>
      <button class="btn pri" id="ssimpan">Simpan rekening</button>
      <div class="err" id="sok" style="color:var(--ok)"></div>
    </div>
  </div>

  <div id="sub-struk" class="hide">
    <div class="box" style="margin-bottom:14px">
      <h2>Edit struk</h2>
      <div class="fld"><label class="lbl" for="s_nama">Nama warung</label><input id="s_nama" maxlength="40"></div>
      <div class="fld"><label class="lbl" for="s_alamat">Alamat</label><input id="s_alamat" maxlength="80" placeholder="Opsional"></div>
      <div class="fld"><label class="lbl" for="s_telp">Telepon / WhatsApp</label><input id="s_telp" maxlength="30" inputmode="tel" placeholder="Opsional"></div>
      <div class="fld"><label class="lbl" for="s_footer">Catatan di bawah struk</label><input id="s_footer" maxlength="60" placeholder="Contoh: Terima kasih"></div>
      <label style="display:flex;gap:8px;align-items:center;margin:4px 0 12px"><input type="checkbox" id="s_logo" style="width:20px;height:20px;padding:0"> Tampilkan logo</label>
      <span class="lbl">Lebar kertas</span>
      <div class="quick" id="lb"></div>
      <button class="btn pri" id="strsimpan" style="margin-top:6px">Simpan struk</button>
      <div class="err" id="strok" style="color:var(--ok)"></div>
    </div>
    <div class="box">
      <h2>Preview struk</h2>
      <div id="prev"></div>
    </div>
  </div>
</section>

<section id="p3" class="hide">
  <div class="box" style="margin-bottom:14px">
    <h2 id="rjudul">Penjualan hari ini</h2>
    <div class="quick" id="rf"></div>
    <div id="rtgl" class="hide"><div class="cal" id="cal"></div></div>
    <div id="rinfo" style="color:var(--mu);font-size:13px;margin:6px 0 8px"></div>
    <div class="tot" style="margin:0 0 6px"><span id="hj">0 pesanan</span><span id="hp">Rp0</span></div><div id="hm"></div>
  </div>
  <div class="box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Riwayat transaksi</h2><button class="btn bad" id="hhapus">Hapus riwayat</button></div>
    <div id="hlist"></div>
  </div>
</section>

<section id="p2" class="hide">
  <div class="box" style="margin-bottom:14px">
    <h2 id="ft">Tambah menu</h2>
    <div class="f">
      <input id="nm" placeholder="Nama menu" aria-label="Nama menu" maxlength="40">
      <input id="hg" inputmode="numeric" placeholder="Harga (Rp)" aria-label="Harga">
      <input id="kt" list="ktl" placeholder="Kategori (mis. Minuman)" aria-label="Kategori" maxlength="20"><datalist id="ktl"></datalist>
      <div style="display:flex;gap:6px">
        <button class="btn pri" id="simpan">Tambah</button>
        <button class="btn hide" id="batal">Batal</button>
      </div>
    </div>
    <div class="err" id="err" role="alert"></div>
  </div>
  <div class="box">
    <h2>Daftar menu (<span id="jml">0</span>)</h2>
    <div id="list"></div>
  </div>
</section>
</div>

<div class="bar" id="bar">
  <div><small style="color:var(--mu)">Total</small><br><b id="bt" style="font-size:18px">Rp0</b></div>
  <button class="btn pri" id="lihat">Lihat pesanan</button>
</div>

<div class="done hide" id="done">
  <div class="box">
    <h2>Pesanan selesai</h2>
    <div id="struk"></div>
    <button class="btn" id="cetak" style="width:100%;margin-top:12px">Cetak struk</button>
    <button class="btn pri" id="tutup" style="width:100%;margin-top:8px">Pesanan baru</button>
  </div>
</div>

<script>
var KEY="kasir-warung-menu-v1";
var DEF=[{id:1,nama:"Nasi putih",harga:5000,kat:"Makanan"},{id:2,nama:"Ayam goreng",harga:15000,kat:"Lauk"},{id:3,nama:"Telur dadar",harga:6000,kat:"Lauk"},{id:4,nama:"Tempe goreng",harga:3000,kat:"Lauk"},{id:5,nama:"Sayur asem",harga:5000,kat:"Lauk"},{id:6,nama:"Es teh manis",harga:4000,kat:"Minuman"},{id:7,nama:"Kopi hitam",harga:5000,kat:"Minuman"}];
var menu=load(),cart={},bayar=0,editId=null,armId=null,katF="Semua",hArm=false,HK="kasir-warung-riwayat-v1",hist=loadH(),metode="Tunai",lastP="";
var $=function(s){return document.querySelector(s)};
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d))return d}catch(e){}return DEF.slice()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(menu))}catch(e){}}
function rp(n){return "Rp"+Number(n||0).toLocaleString("id-ID")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function digits(s){return parseInt(String(s).replace(/\D/g,""),10)||0}
function total(){return menu.reduce(function(t,m){return t+(cart[m.id]||0)*m.harga},0)}

function kat(m){return m.kat||"Lainnya"}
function cats(){var c=[];menu.forEach(function(m){if(c.indexOf(kat(m))<0)c.push(kat(m))});return c}
function renderKat(){
  var c=cats();if(katF!=="Semua"&&c.indexOf(katF)<0)katF="Semua";
  $("#kat").innerHTML=["Semua"].concat(c).map(function(x){return '<button class="btn'+(x===katF?' pri':'')+'" data-kat="'+esc(x)+'">'+esc(x)+'</button>'}).join("");
  $("#ktl").innerHTML=c.map(function(x){return '<option value="'+esc(x)+'">'}).join("");
}
function renderMenu(){
  var q=$("#cari").value.toLowerCase();renderKat();
  var h=menu.filter(function(m){return m.nama.toLowerCase().indexOf(q)>-1&&(katF==="Semua"||kat(m)===katF)}).map(function(m){
    var n=cart[m.id]||0;
    return '<button class="item'+(n?' in':'')+'" data-add="'+m.id+'"><b>'+esc(m.nama)+'</b><span>'+rp(m.harga)+'</span>'+(n?'<i>'+n+'</i>':'')+'</button>';
  }).join("");
  $("#menu").innerHTML=h||'<div class="empty" style="grid-column:1/-1">Menu tidak ditemukan. Tambahkan di tab Kelola menu.</div>';
}
function renderCart(){
  var rows=menu.filter(function(m){return cart[m.id]}).map(function(m){
    var n=cart[m.id];
    return '<div class="row"><div class="n">'+esc(m.nama)+'<small>'+rp(m.harga)+' × '+n+' = '+rp(m.harga*n)+'</small></div><div class="qty"><button data-min="'+m.id+'" aria-label="Kurangi">−</button><b>'+n+'</b><button data-plus="'+m.id+'" aria-label="Tambah">+</button></div></div>';
  }).join("");
  $("#cart").innerHTML=rows||'<div class="empty">Belum ada pesanan. Ketuk menu untuk menambahkan.</div>';
  var t=total();
  $("#total").textContent=rp(t);$("#bt").textContent=rp(t);
  var q=[{l:"Uang pas",v:t},{l:"10 rb",v:10000},{l:"20 rb",v:20000},{l:"50 rb",v:50000},{l:"100 rb",v:100000}];
  $("#quick").innerHTML=q.map(function(x){return '<button class="btn" data-q="'+x.v+'"'+(x.v?'':' disabled')+'>'+x.l+'</button>'}).join("");
  renderKem();
}
function renderKem(){
  var t=total(),sel=bayar-t,k=$("#kem");
  if(bayar>=t&&t>0){k.className="kem";$("#kl").textContent="Kembalian";$("#kv").textContent=rp(sel)}
  else if(t>0&&bayar>0){k.className="kem kurang";$("#kl").textContent="Uang kurang";$("#kv").textContent=rp(-sel)}
  else{k.className="kem";$("#kl").textContent="Kembalian";$("#kv").textContent=rp(0)}
  var tn=metode==="Tunai";$("#cashbox").classList.toggle("hide",!tn);$("#selesai").disabled=!(t>0&&(!tn||bayar>=t));$("#selesai").textContent=tn?"Selesaikan pesanan":"Pembayaran diterima";renderPinfo();
  $("#kosong").disabled=!t;
}
function renderList(){
  $("#jml").textContent=menu.length;
  $("#list").innerHTML=menu.map(function(m){
    var arm=armId===m.id;

var rng="1h",dFrom="",dTo="",RN=[["1h","1 hari"],["1m","1 minggu"],["1b","1 bulan"],["1t","1 tahun"],["tgl","Pilih tanggal"]],RL={"1h":"hari ini","1m":"1 minggu terakhir","1b":"1 bulan terakhir","1t":"1 tahun terakhir"};
function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function tg(d){return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}
function rentang(){
  var a=new Date(),b=new Date();a.setHours(0,0,0,0);b.setHours(23,59,59,999);
  if(rng==="1m")a.setDate(a.getDate()-6);
  else if(rng==="1b")a.setDate(a.getDate()-29);
  else if(rng==="1t")a.setDate(a.getDate()-364);
  else if(rng==="tgl"){
    var f=dFrom||dTo||ymd(new Date()),t=dTo||dFrom||f;
    a=new Date(f+"T00:00:00");b=new Date(t+"T23:59:59.999");
    if(a>b){var x=new Date(a.getTime());a=new Date(b.getTime());a.setHours(0,0,0,0);b=new Date(x.getTime());b.setHours(23,59,59,999)}
  }
  return {a:a,b:b}
}
var cm=null,pick=false,SL='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',SR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
function renderCal(){
  if(!cm){var b=dFrom?new Date(dFrom+"T00:00:00"):new Date();cm=new Date(b.getFullYear(),b.getMonth(),1)}
  var y=cm.getFullYear(),m=cm.getMonth(),lead=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate(),pd=new Date(y,m,0).getDate(),today=ymd(new Date());
  var f=dFrom||dTo,t=dTo||dFrom;if(f&&t&&f>t){var z=f;f=t;t=z}
  var h='<div class="ch"><button class="cn" data-cm="-1" aria-label="Bulan sebelumnya">'+SL+'</button><b>'+cm.toLocaleDateString("id-ID",{month:"long",year:"numeric"})+'</b><button class="cn" data-cm="1" aria-label="Bulan berikutnya">'+SR+'</button></div><div class="cg">';
  ["SEN","SEL","RAB","KAM","JUM","SAB","MIN"].forEach(function(w){h+='<div class="cw">'+w+'</div>'});
  for(var i=lead;i>0;i--)h+='<button class="cd o" disabled tabindex="-1">'+(pd-i+1)+'</button>';
  for(var d=1;d<=days;d++){
    var k=y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2),c="cd";
    if(f&&t&&k>f&&k<t)c+=" r";
    if(k===f)c+=" s";
    if(k===t)c+=" e";
    if(k===today)c+=" t";
    h+='<button class="'+c+'" data-day="'+k+'">'+d+'</button>';
  }
  h+='</div><div class="cs">'+(pick?"Ketuk tanggal akhir":"Ketuk satu tanggal, atau dua tanggal untuk rentang")+'</div>';
  $("#cal").innerHTML=h;
}

    return '<div class="row"><div class="n"><b>'+rp(x.t)+'</b> <small style="display:inline">('+esc(x.m||"Tunai")+')</small><small>'+new Date(x.w).toLocaleString("id-ID")+'</small><small>'+x.i.map(function(i){return esc(i.n)+' ×'+i.q}).join(", ")+'</small></div></div>';
  }).join("")+(sel.length>200?'<div class="empty">Menampilkan 200 transaksi terbaru dari '+sel.length+'.</div>':'')||'<div class="empty">Tidak ada transaksi pada rentang ini.</div>';
  $("#hhapus").className="btn bad"+(hArm?" arm":"");
  $("#hhapus").textContent=hArm?"Yakin hapus semua?":"Hapus semua riwayat";
